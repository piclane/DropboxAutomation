[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "schedule_to_iCloud"
version = "1.0.0"
description = "スケジュールを RabbitMQ 経由で受信し、iCloud に登録します"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "picane", email = "piclane@gmail.com" }
]

dependencies = [
    "python-dotenv>=0.19.0",
    "pika>=1.3.2",
    "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
s2ic = "main:main"

[tool.hatch.envs.default]
dependencies = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]
